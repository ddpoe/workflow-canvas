[tool.poetry]
name = "wfc-client"
version = "0.2.0"
description = "Tier-1 sugar for writing Workflow Canvas (wfc) methods, with one small dependency"
authors = ["Dante <dantepoe@noboundssolutions.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/ddpoe/workflow-canvas"
repository = "https://github.com/ddpoe/workflow-canvas"
keywords = ["workflow", "pipeline", "methods", "reproducibility", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{ include = "wfc_client" }]

# One small dependency by design (ADR-020): wfc-client is a metadata recorder
# that imports the Python standard library plus axiom-annotations, whose
# workflow markers narrate `wfc.run()`. Nothing else, and nothing scientific.
[tool.poetry.dependencies]
python = ">=3.9"
axiom-annotations = ">=0.1.0,<0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Type checking: `mypy` from this directory (strict; the package ships py.typed).
[tool.mypy]
# The oldest target current mypy accepts; the package itself supports 3.9.
python_version = "3.10"
files = ["wfc_client"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# axiom-annotations ships no type information.
[[tool.mypy.overrides]]
module = ["axiom_annotations", "axiom_annotations.*"]
ignore_missing_imports = true
