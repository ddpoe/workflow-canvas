name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      keep_probe:
        type: boolean
        default: false
        description: "Leave the GHCR probe package in place for a manual read (diagnostic)"
      skip_windows:
        type: boolean
        default: false
        description: "Test on Linux and macOS only (the Windows job takes about an hour)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push and pull request; Windows and macOS (a Windows
        # minute bills twice, a macOS minute ten times) on main and on a
        # manual run. A manual run with skip_windows leaves Windows out.
        os: >-
          ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.skip_windows)
          && '["ubuntu-latest", "macos-latest"]'
          || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
          && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Configure git
        # The tests create and commit to throwaway repositories.
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      # Some tests drive the Canvas's TypeScript through Node (22.6+); they skip without it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          poetry env use python
          poetry install --with dev
      - name: Test workflow-canvas
        # Windows runs the suite in four parallel workers: serially it takes
        # over an hour there, and `-n auto` counts physical cores, which is
        # one on the runner. The tests wait on git, Snakemake and the
        # filesystem, so four workers beat two on a two-CPU runner too.
        run: poetry run pytest ${{ runner.os == 'Windows' && '-n 4' || '' }}
      - name: Test wfc-client
        run: poetry run pytest wfc-client/tests

  client:
    # wfc-client runs inside users' method containers and supports Python 3.9+.
    name: wfc-client (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: wfc-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - run: pytest tests

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install
        run: |
          poetry env use python
          poetry install --with dev
      - name: ruff
        run: poetry run ruff check --output-format github
      - name: mypy
        run: poetry run mypy

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: userdocs/requirements.txt
      # The same install and build commands Read the Docs runs (.readthedocs.yaml).
      - run: pip install -r userdocs/requirements.txt
      - run: sphinx-build -W --keep-going -c userdocs/_sphinx -b html userdocs/guide _site

  frontend:
    name: Canvas front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wfc/canvas/static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wfc/canvas/static/package-lock.json
      - run: npm ci
      - run: npm test

  integration:
    # Needs Linux containers, which GitHub's Windows and macOS runners do not provide.
    name: Integration (Docker)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install
        run: |
          poetry env use python
          poetry install --with dev
      - name: Integration tests
        run: poetry run pytest -m integration

  ghcr:
    # Pushes a labelled image to the throwaway package <repo>/wfc-ci-probe and
    # reads its repository link with `gh api`. Main pushes, and a manual run on
    # any branch; never a pull request (one from a fork gets no packages: write).
    name: GHCR push and package link
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WFC_GHCR_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install
        run: |
          poetry env use python
          poetry install --with dev
      - name: Log Docker in to ghcr.io
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: GHCR test
        run: poetry run pytest -m ghcr
      - name: Delete the pushed test version
        if: always() && !inputs.keep_probe
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          package=$(printf '%s' "${repo,,}/wfc-ci-probe" | jq -sRr @uri)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for kind in users orgs; do
            route="/$kind/$owner/packages/container/$package"
            # The owner is a user or an organisation: the other route answers
            # 404, which is printed here and is expected once.
            if ! versions=$(gh api "$route/versions" --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"$WFC_GHCR_TAG\")) | .id"); then
              echo "No package at $route; trying the next owner kind."
              continue
            fi
            if [ -z "$versions" ]; then
              echo "::warning::$route has no version tagged $WFC_GHCR_TAG to delete."
              exit 0
            fi
            # Tagged versions this run did not push (a kept probe, another run).
            if ! others=$(gh api "$route/versions" --paginate \
              --jq ".[] | select((.metadata.container.tags | length) > 0 and (.metadata.container.tags | index(\"$WFC_GHCR_TAG\") | not)) | .id"); then
              echo "::error::Could not list the versions of $route."
              exit 1
            fi
            if [ -z "$others" ]; then
              # GitHub refuses to delete a package's last tagged version on
              # its own: delete the whole probe package instead.
              echo "The version tagged $WFC_GHCR_TAG is the last one: deleting the package $route."
              if ! gh api -X DELETE "$route"; then
                echo "::error::Could not delete the package $route."
                exit 1
              fi
              exit 0
            fi
            failed=0
            for id in $versions; do
              if ! gh api -X DELETE "$route/versions/$id"; then
                echo "::error::Could not delete the version $id of $route."
                failed=1
              fi
            done
            exit "$failed"
          done
          echo "::error::Could not find the package $package under users/ or orgs/$owner to delete the test version."
          exit 1
