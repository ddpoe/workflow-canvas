# Contract for the demo `__demo__plot` method:
#   inputs.data     <-> ctx.input("data")
#   outputs.figure  <-> ctx.save_artifact("figure", ...)  (a .png artifact)
#   params.*        <-> ctx.params[...]
# No threshold param on purpose: the figure colours by the label column the
# upstream `__demo__label` method wrote.
inputs:
  data:
    type: .csv
    required: true
    description: "Labelled cells from __demo__label"

outputs:
  figure:
    type: .png
    required: true
    description: "Density of value_column over its histogram, shaded by threshold side"

params:
  value_column:
    type: str
    required: false
    default: "intensity"
    options_from: data
    description: "Column to histogram"
  bins:
    type: int
    required: false
    default: 20
    description: "Number of histogram bins drawn under the density curve"
  smoothing:
    type: float
    required: false
    default: 1.0
    description: "Density curve smoothness; 1.0 is Silverman's bandwidth, higher is smoother"

executor: local
env: wfc-demo-env
