[project]
name = "uvproj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "six==1.16.0",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "markupsafe==2.1.5",
]

[project.optional-dependencies]
plot = ["idna==3.7"]

[dependency-groups]
dev = ["iniconfig==2.0.0"]
docs = ["certifi==2024.2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
