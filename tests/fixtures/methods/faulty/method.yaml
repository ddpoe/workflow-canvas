# tests/fixtures/methods/faulty/method.yaml
# Configurable failure method for testing error handling.
# Same input/output contract as transform so it can be swapped in.
inputs:
  data:
    type: .csv
    required: true
    description: "Input CSV (may not be used depending on failure mode)"

outputs:
  output:
    type: .csv
    required: true
    description: "Output CSV (may not be produced depending on failure mode)"

params:
  failure_mode:
    type: str
    required: true
    description: "'crash' raises an exception, 'missing_output' exits without writing output, 'succeed' behaves like transform"
  crash_samples:
    type: str
    required: false
    default: ""
    description: "Comma-separated sample names that crash regardless of failure_mode (a per-sample failure with no variant override)"
  pre_crash_duration_s:
    type: float
    required: false
    default: 4.5
    description: "stream_fail mode: seconds of streamed output before the crash"
  pre_crash_stdout_lines:
    type: int
    required: false
    default: 3
    description: "stream_fail mode: number of stdout ticks before the crash"
  crash_at_tick:
    type: int
    required: false
    description: "stream_fail mode: the tick the crash lands on (defaults to the last tick)"
  exit_code:
    type: int
    required: false
    default: 3
    description: "nonzero_exit mode: the status the method exits with"

executor: python
env: fixture-env
